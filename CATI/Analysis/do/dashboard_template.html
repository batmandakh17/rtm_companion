<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTM Dashboard</title>
<!-- The page only draws what Stata wrote into dashboard_data.js (the DASHBOARD section of CATI/Analysis/do/hf_l2phl_syn_analysis.do); nothing is computed here. -->
<style>
:root {
  color-scheme: light;
  --page: #f5f4f1; --surface-1: #fcfcfb; --surface-2: #f0efec; --border: #dddcd6;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77766f;
  --grid: #e4e3de; --axis: #a3a29b;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-5: #e87ba4;
  --warn: #fab219; --warn-ink: #7a5300; --good-ink: #0a6b0a;
  --seq-100: #cde2fb; --seq-200: #9ec5f4; --seq-300: #6da7ec; --seq-400: #3987e5; --seq-500: #256abf; --seq-600: #184f95; --seq-700: #0d366b;
  --flag-1: #fde6da; --flag-2: #f8bfa3; --flag-3: #ef8f62; --flag-4: #d95926; --flag-ink-hi: #ffffff; --flag-ink-lo: #0b0b0b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #121211; --surface-1: #1a1a19; --surface-2: #262624; --border: #383835;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f;
    --grid: #2e2e2b; --axis: #6a6963;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181;
    --warn-ink: #fab219; --good-ink: #3fbf3f;
    --flag-1: #3a2316; --flag-2: #6b3419; --flag-3: #a4431c; --flag-4: #d95926; --flag-ink-lo: #f0efec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121211; --surface-1: #1a1a19; --surface-2: #262624; --border: #383835;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f;
  --grid: #2e2e2b; --axis: #6a6963;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181;
  --warn-ink: #fab219; --good-ink: #3fbf3f;
  --flag-1: #3a2316; --flag-2: #6b3419; --flag-3: #a4431c; --flag-4: #d95926; --flag-ink-lo: #f0efec;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 20px 16px 8px; max-width: 1180px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 2px; font-weight: 650; }
.sub { color: var(--text-secondary); }
.banner { margin: 12px 0 0; padding: 8px 12px; border: 1px solid var(--border); border-left: 4px solid var(--warn); background: var(--surface-1); border-radius: 6px; color: var(--text-secondary); }
nav { max-width: 1180px; margin: 0 auto; padding: 8px 16px 0; display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
nav button { font: inherit; background: none; border: 0; padding: 8px 12px; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; }
nav button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--text-primary); font-weight: 600; }
nav button .n { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--flag-4); color: #fff; font-size: 11px; font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
section[hidden] { display: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.card .note { color: var(--text-muted); font-size: 12px; margin: 0 0 8px; }
.wide { grid-column: 1 / -1; }
section > .card, section > .grid { margin-bottom: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.kpi .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--text-secondary); font-size: 12px; }
.kpi .d { color: var(--text-muted); font-size: 12px; }
.kpi.warnk .v { color: var(--warn-ink); }
.kpi.goodk .v { color: var(--good-ink); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; vertical-align: top; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { color: var(--text-secondary); font-weight: 600; font-size: 12px; }
tr.all td { font-weight: 600; background: var(--surface-2); }
td.txt, th.txt { text-align: left; white-space: normal; max-width: 360px; }
table.wrap th { white-space: normal; }
.grid.panelrow { grid-template-columns: 2fr 1fr; }
@media (max-width: 760px) { .grid.panelrow { grid-template-columns: 1fr; } }
td.rule { text-align: left; white-space: normal; max-width: 300px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--text-secondary); }
.scroll { overflow-x: auto; }
.filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; border: 0; background: var(--surface-1); color: var(--text-secondary); padding: 5px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); }
select { font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--text-secondary); cursor: pointer; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin: 2px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text-secondary); font-size: 11px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 2px 8px rgb(0 0 0 / 0.15); max-width: 320px; }
.tip b { font-weight: 600; }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.heat td.c { min-width: 64px; }
.flag { color: var(--warn-ink); font-weight: 600; }
.ok { color: var(--good-ink); }
.muted { color: var(--text-muted); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--text-secondary); }
.pill.added { background: var(--seq-100); color: var(--seq-700); }
.pill.dropped { background: var(--flag-1); color: #7a2e0e; }
.pill.rot { background: var(--surface-2); }
td.fl { border-radius: 3px; }
td.fl1 { background: var(--flag-1); color: var(--flag-ink-lo); }
td.fl2 { background: var(--flag-2); color: var(--flag-ink-lo); }
td.fl3 { background: var(--flag-3); color: var(--flag-ink-hi); }
td.fl4 { background: var(--flag-4); color: var(--flag-ink-hi); }
td.out { background: var(--flag-1); color: var(--flag-ink-lo); font-weight: 600; }
details summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; margin-top: 6px; }
.bar-in { display: inline-block; height: 8px; border-radius: 0 4px 4px 0; background: var(--series-1); vertical-align: 0; margin-left: 6px; }
ul.plain { margin: 4px 0 0; padding-left: 18px; }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .kpi .v { font-size: 22px; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Real-time monitoring dashboard</h1>
  <div class="sub" id="subtitle"></div>
  <div class="banner">Synthetic data. These numbers show what the workflow produces from a made-up panel; they are not results of any survey.</div>
</header>
<nav role="tablist">
  <button role="tab" data-tab="overview">Overview</button>
  <button role="tab" data-tab="fieldwork">Fieldwork</button>
  <button role="tab" data-tab="enumerators">Enumerators</button>
  <button role="tab" data-tab="results">Results</button>
  <button role="tab" data-tab="explorer">Module explorer</button>
  <button role="tab" data-tab="quality">Quality checks</button>
  <button role="tab" data-tab="sample">Sample and weights</button>
</nav>
<main>
  <section id="sec-overview"></section>
  <section id="sec-fieldwork" hidden></section>
  <section id="sec-enumerators" hidden></section>
  <section id="sec-results" hidden></section>
  <section id="sec-explorer" hidden></section>
  <section id="sec-quality" hidden></section>
  <section id="sec-sample" hidden></section>
</main>
<div id="tip" class="tip" hidden></div>
<script src="dashboard_data.js"></script>
<script>
(function () {
  const D = window.DATA;
  if (!D) { document.querySelector("main").textContent = "dashboard_data.js was not found next to this page. Run L2PHL_SYN_master.do."; return; }
  const NS = "http://www.w3.org/2000/svg";
  const SERIES = ["var(--series-1)", "var(--series-2)", "var(--series-3)", "var(--series-4)", "var(--series-5)"];
  const rounds = D.meta.rounds.map(r => r.round);
  const lastRound = rounds[rounds.length - 1];
  const INFO = /rows read|largest \/ smallest|largest weight|design effect|share of census|raking passes|largest gap/;   // checks that report a value rather than find problems
  const roundColor = r => SERIES[(rounds.indexOf(r)) % SERIES.length];
  const pct = (x, d = 0) => x == null ? "<10" : (100 * x).toFixed(d) + "%";
  const num = (x, d = 1) => x == null ? "<10" : Number(x).toFixed(d);
  const fmtInt = x => x == null ? "–" : Math.round(x).toLocaleString("en-US");
  const h = (tag, attrs = {}, parent, text) => {
    const e = document.createElement(tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const s = (tag, attrs = {}, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  document.getElementById("subtitle").textContent =
    `${D.meta.title} · rounds ${rounds.join(", ")} · generated ${D.meta.made}`;

  // ---------- the audit's totals, used in several places
  const AUDIT = D.audit || [];
  const auditTotals = r => {
    const rows = AUDIT.filter(x => x.round === r);
    const sum = k => rows.reduce((a, x) => a + (x[k] || 0), 0);
    return { routing: sum("routing_broken"), required: sum("required_missing"), range: sum("out_of_range"),
      untranslated: rows.filter(x => /not translated/.test(x.status) && !/constraint/.test(x.status)).length, questions: rows.length };
  };
  const checksFound = r => D.checks.filter(x => x.n > 0 && !INFO.test(x.check) && (r == null || x.round === r)).length;

  // ---------- tooltip
  const tip = document.getElementById("tip");
  function showTip(ev, html) {
    tip.innerHTML = html; tip.hidden = false;
    const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    const y = Math.min(ev.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  const hideTip = () => { tip.hidden = true; };
  const hover = (el, html) => { el.addEventListener("mousemove", ev => showTip(ev, html())); el.addEventListener("mouseleave", hideTip); };

  function card(parent, title, note, wide) {
    const c = h("div", { class: "card" + (wide ? " wide" : "") }, parent);
    h("h3", {}, c, title);
    if (note) h("p", { class: "note" }, c, note);
    return c;
  }
  function legend(parent, items) {
    if (items.length < 2) return;
    const l = h("div", { class: "legend" }, parent);
    items.forEach(it => { const sp = h("span", {}, l); h("i", { style: `background:${it.color}` }, sp); sp.appendChild(document.createTextNode(it.name)); });
  }
  function niceScale(v, top) {
    if (top) return { top, step: top / 4 };
    if (!(v > 0)) return { top: 1, step: 0.25 };
    const raw = v / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    const step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
    return { top: Math.ceil(v / step - 1e-9) * step, step };
  }
  function roundedBar(x, y, w, hgt, horizontal) {
    const r = Math.min(4, (horizontal ? hgt : w) / 2, horizontal ? w : hgt);
    if (hgt <= 0 || w <= 0) return "";
    if (horizontal) return `M${x},${y}h${w - r}a${r},${r} 0 0 1 ${r},${r}v${hgt - 2 * r}a${r},${r} 0 0 1 ${-r},${r}h${-(w - r)}z`;
    return `M${x},${y + hgt}v${-(hgt - r)}a${r},${r} 0 0 1 ${r},${-r}h${w - 2 * r}a${r},${r} 0 0 1 ${r},${r}v${hgt - r}z`;
  }

  // ---------- line chart: series [{name, color, pts:[{x, y, lo, hi}]}]
  function lineChart(host, o) {
    const W = 520, H = o.height || 230, m = { l: 44, r: o.series.length > 1 && o.series.length <= 4 ? 70 : 16, t: 10, b: 30 };
    const xs = [...new Set(o.series.flatMap(sr => sr.pts.map(p => p.x)))].sort((a, b) => a - b);
    const sc = niceScale(Math.max(...o.series.flatMap(sr => sr.pts.map(p => p.hi != null ? p.hi : p.y)).filter(v => v != null)), o.yMax);
    const ymax = sc.top;
    const X = v => m.l + (xs.length > 1 ? (v - xs[0]) / (xs[xs.length - 1] - xs[0]) : 0.5) * (W - m.l - m.r);
    const Y = v => H - m.b - (v / ymax) * (H - m.t - m.b);
    legend(host, o.series.map(sr => ({ name: sr.name, color: sr.color })));
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": o.label || "" }, host);
    for (let v = 0; v <= ymax + 1e-9; v += sc.step) {
      const y = Y(v);
      s("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: v ? "var(--grid)" : "var(--axis)" }, svg);
      s("text", { x: m.l - 6, y: y + 4, "text-anchor": "end" }, svg, o.yFmt(v));
    }
    const step = Math.ceil(xs.length / 9);
    xs.forEach((v, i) => { if (i % step === 0 || i === xs.length - 1) s("text", { x: X(v), y: H - m.b + 16, "text-anchor": "middle" }, svg, o.xFmt ? o.xFmt(v) : v); });
    if (o.xLabel) s("text", { x: (m.l + W - m.r) / 2, y: H - 2, "text-anchor": "middle" }, svg, o.xLabel);
    const ends = [];
    o.series.forEach(sr => {
      const pts = sr.pts.filter(p => p.y != null).sort((a, b) => a.x - b.x);
      if (o.ci) pts.forEach(p => { if (p.lo != null) s("line", { x1: X(p.x), x2: X(p.x), y1: Y(p.lo), y2: Y(p.hi), stroke: sr.color, "stroke-width": 2, "stroke-linecap": "round", opacity: 0.55 }, svg); });
      let d = "";
      pts.forEach((p, i) => { const join = i && xs.indexOf(p.x) - xs.indexOf(pts[i - 1].x) === 1; d += (join ? "L" : "M") + X(p.x) + "," + Y(p.y); });
      if (pts.length > 1) s("path", { d, fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round" }, svg);
      if (o.markers || pts.length <= 12) pts.forEach(p => s("circle", { cx: X(p.x), cy: Y(p.y), r: 4, fill: sr.color, stroke: "var(--surface-1)", "stroke-width": 2 }, svg));
      if (o.series.length > 1 && o.series.length <= 4 && pts.length) { const p = pts[pts.length - 1]; ends.push({ x: X(p.x) + 8, y: Y(p.y) + 4, t: sr.name }); }
    });
    ends.sort((a, b) => a.y - b.y).forEach((e, i, arr) => { if (i && e.y - arr[i - 1].y < 12) e.y = arr[i - 1].y + 12; s("text", { x: e.x, y: e.y, style: "fill:var(--text-primary)" }, svg, e.t); });
    const cross = s("line", { y1: m.t, y2: H - m.b, stroke: "var(--axis)", "stroke-dasharray": "3 3", visibility: "hidden" }, svg);
    const hit = s("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" }, svg);
    hit.addEventListener("mousemove", ev => {
      const r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) * W / r.width;
      let best = xs[0]; xs.forEach(v => { if (Math.abs(X(v) - vx) < Math.abs(X(best) - vx)) best = v; });
      cross.setAttribute("x1", X(best)); cross.setAttribute("x2", X(best)); cross.setAttribute("visibility", "visible");
      let html = `<b>${o.xName || ""} ${o.xFmt ? o.xFmt(best) : best}</b>`;
      o.series.forEach(sr => { const p = sr.pts.find(q => q.x === best); if (p) html += `<br><span class="sw" style="background:${sr.color}"></span>${sr.name}: ${p.y == null ? "<10 cases" : o.yFmt(p.y, true)}${p.lo != null ? ` (${o.yFmt(p.lo, true)}–${o.yFmt(p.hi, true)})` : ""}`; });
      showTip(ev, html);
    });
    hit.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
  }

  // ---------- grouped bar chart: cats [labels], series [{name, color, vals}]
  function barChart(host, o) {
    const horizontal = !!o.horizontal;
    const n = o.cats.length, k = o.series.length;
    const rowH = horizontal ? Math.max(18, 10 * k + 8) : 0;
    const W = o.width || 520, H = horizontal ? 24 + n * rowH : (o.height || 220);
    const m = horizontal ? { l: o.labelWidth || 170, r: 40, t: 4, b: 20 } : { l: 44, r: 8, t: 10, b: 30 };
    const sc = niceScale(Math.max(...o.series.flatMap(sr => sr.vals).filter(v => v != null)), o.max);
    const vmax = sc.top;
    legend(host, o.series.map(sr => ({ name: sr.name, color: sr.color })));
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": o.label || "" }, host);
    const span = horizontal ? (W - m.l - m.r) : (H - m.t - m.b);
    const V = v => (v / vmax) * span;
    for (let v = 0; v <= vmax + 1e-9; v += sc.step) {
      if (horizontal) { const x = m.l + V(v); s("line", { x1: x, x2: x, y1: m.t, y2: H - m.b, stroke: v ? "var(--grid)" : "var(--axis)" }, svg); s("text", { x, y: H - 4, "text-anchor": "middle" }, svg, o.fmt(v)); }
      else { const y = H - m.b - V(v); s("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: v ? "var(--grid)" : "var(--axis)" }, svg); s("text", { x: m.l - 6, y: y + 4, "text-anchor": "end" }, svg, o.fmt(v)); }
    }
    const band = horizontal ? rowH : (W - m.l - m.r) / n;
    const bw = Math.max(3, (band - 8) / k - 2);
    o.cats.forEach((c, i) => {
      if (horizontal) s("text", { x: m.l - 8, y: m.t + i * band + band / 2 + 4, "text-anchor": "end" }, svg, c);
      else s("text", { x: m.l + i * band + band / 2, y: H - m.b + 16, "text-anchor": "middle" }, svg, c);
      o.series.forEach((sr, j) => {
        const v = sr.vals[i]; if (v == null) return;
        const off = 4 + j * (bw + 2);
        const d = horizontal ? roundedBar(m.l + 1, m.t + i * band + off, V(v), bw, true) : roundedBar(m.l + i * band + off, H - m.b - V(v), bw, V(v), false);
        const p = s("path", { d, fill: sr.color }, svg);
        hover(p, () => `<b>${c}</b><br><span class="sw" style="background:${sr.color}"></span>${sr.name}: ${o.fmt(v, true)}`);
      });
    });
  }

  // ---------- 100% stacked horizontal bars: rows [{name, parts:[values]}], cats [{name, color}]
  function stackChart(host, o) {
    const W = 520, rowH = 30, H = o.rows.length * rowH + 4, m = { l: 70, r: 4 };
    legend(host, o.cats);
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": o.label || "" }, host);
    o.rows.forEach((row, i) => {
      const tot = row.parts.reduce((a, b) => a + (b || 0), 0) || 1;
      let x = m.l; const y = 4 + i * rowH;
      s("text", { x: m.l - 8, y: y + 15, "text-anchor": "end" }, svg, row.name);
      row.parts.forEach((v, j) => {
        const w = (v || 0) / tot * (W - m.l - m.r);
        if (w <= 0) return;
        const r = s("rect", { x, y, width: Math.max(0, w - 2), height: 20, fill: o.cats[j].color }, svg);
        hover(r, () => `<b>${row.name}</b><br><span class="sw" style="background:${o.cats[j].color}"></span>${o.cats[j].name}: ${fmtInt(v)} (${pct(v / tot, 1)}${o.unit ? " of " + o.unit : ""})`);
        x += w;
      });
    });
  }

  function tableOf(parent, cols, rows, opts = {}) {

    const lab2 = h("label", { class: "chk" }, f2); const all2 = h("input", { type: "checkbox" }, lab2); lab2.appendChild(document.createTextNode("show checks that found nothing"));
    const holder2 = h("div", {}, cc);
    function drawChecks() {
      holder2.innerHTML = "";
      const rows = D.checks.filter(x => !INFO.test(x.check) || all2.checked).map(x => ({ ...x, found: x.n > 0 && !INFO.test(x.check) })).filter(x => all2.checked || x.found)
        .sort((a, b) => (b.found - a.found) || (a.round - b.round) || (a.step - b.step));
      if (!rows.length) { h("p", { class: "ok" }, holder2, "No processing check found anything."); return; }
      tableOf(holder2, ["Check", "Round", "Step", "Count", "Action"], rows.map(x => [x.check, x.round, x.step, cell((x.found ? "⚠ " : "") + (Number.isInteger(x.n) ? fmtInt(x.n) : x.n), x.found ? "flag" : ""), x.action]), { left: [4] });
    }
    all2.addEventListener("change", drawChecks); drawChecks();

    // ---- review lists
    const cr = card(sec, "Review lists", "Rows a rule cannot judge, written to the round's fix folder (CATI/Round##/fix/&lt;date&gt;) for a person to read before the round is closed. They hold household IDs, so they stay with the team.", true);
    if (!D.reviews || !D.reviews.length) h("p", { class: "ok" }, cr, "No review lists this run.");
    else tableOf(cr, ["File", "Rows"], D.reviews.map(x => [x.file, fmtInt(x.rows)]));
    const ch = card(sec, "What to do with a flag", null, true);
    const ul = h("ul", { class: "plain" }, ch);
    ["Read it against the routing first: a question can be empty because the respondent was rightly routed past it, and a rotating module is absent by design.",
     "Give it a likely cause and an owner. A routing condition missing from the form goes to the questionnaire team; an answer that breaks a correct condition goes to the field team; a variable the condition needs but the data lack goes to the processing team.",
     "Fix it in the round where it started: a correction in the do-files with its reason, a callback from the review list, or a change to the form before the next round.",
     "The households behind the flags are listed by ID, with the submission, the question and the answer as recorded, in CATI/Round##/fix/&lt;date&gt;/R##_form_flags.csv. That file stays with the team; this page shows counts only."].forEach(t => h("li", {}, ul, t));
  })();

  // ======================================================== Sample and weights
  (function () {
    const sec = document.getElementById("sec-sample");
    if (D.sample) {
      const cs = card(sec, "Sample", "Baseline (face to face): PSUs drawn with probability proportional to census households in each stratum, 15 households in each. Phone panel: in each PSU, households with a phone ranked by a random key drawn at baseline; the first 6 (urban) or 7 (rural) are the main sample, the rest are replacements in order.", true);
      tableOf(cs, ["Stratum", "PSUs in frame", "Census households", "PSUs drawn", "Baseline households", "with a phone", "Phone main sample", "Replacements", "Mean baseline weight"],
        D.sample.map(x => [`Region ${x.region}, ${x.locale === 1 ? "urban" : "rural"}`, fmtInt(x.frame_psus), fmtInt(x.census_households), x.psus, fmtInt(x.baseline), fmtInt(x.phone), fmtInt(x.main), fmtInt(x.repl), fmtInt(x.w_bl)]));
    }
    if (D.weights) {
      const cw = card(sec, "Round weights", "Each person present in an interviewed household starts from the household's phone-sample weight (a replacement comes from the same PSU list, so it starts from the same weight). The person weights are then post-stratified in cells of stratum × age group × sex to the baseline population, as L2PHL does; the household weight is the mean of its members' person weights, so its sum is close to, not exactly, the census household count. Raking and entropy balancing to the same margins are the alternatives (global WEIGHTS). Design effect from unequal weights = 1 + CV².", true);
      tableOf(cw, ["Round", "Method", "Households weighted", "Persons weighted", "of which households from the replacement list", "Sum of household weights", "Smallest", "Largest", "Design effect", "Cells", "Cells under 10 persons"],
        D.weights.map(x => [x.round, x.method, fmtInt(x.households), fmtInt(x.persons), fmtInt(x.replacements), fmtInt(x.hhw_sum), fmtInt(x.hhw_min), fmtInt(x.hhw_max), num(x.deff, 2), x.cells == null ? "" : x.cells, x.cells_small == null ? "" : x.cells_small]), { left: [1] });
    }
  })();

  // ---------- tabs: a count on the Quality tab; the chosen tab is remembered in this browser when storage is allowed
  const tabs = [...document.querySelectorAll("nav button")];
  const atl = auditTotals(lastRound), nq = atl.routing + atl.required + atl.range + checksFound(lastRound);
  if (nq) h("span", { class: "n" }, tabs.find(b => b.dataset.tab === "quality"), fmtInt(nq));
  function select(name) {
    tabs.forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
    document.querySelectorAll("main > section").forEach(sct => { sct.hidden = sct.id !== "sec-" + name; });
    try { localStorage.setItem("rtm_tab", name); } catch (e) { /* storage blocked */ }
  }
  tabs.forEach(b => b.addEventListener("click", () => select(b.dataset.tab)));
  let start = "overview";
  try { start = localStorage.getItem("rtm_tab") || start; } catch (e) { /* storage blocked */ }
  if (location.hash.length > 1) start = location.hash.slice(1);
  select(tabs.some(b => b.dataset.tab === start) ? start : "overview");
})();
</script>
</body>
</html>
